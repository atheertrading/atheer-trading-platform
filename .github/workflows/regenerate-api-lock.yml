name: Regenerate API dependency lockfile
on:
  push:
    branches: [feat/postgres-persistence-foundation]
    paths:
      - "services/api/package.json"
permissions:
  contents: write
concurrency:
  group: api-lockfile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regenerate npm lockfile from exact package manifest
        working-directory: services/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- services/api/package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/package-lock.json
          git commit -m "build(api): lock PostgreSQL driver dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
