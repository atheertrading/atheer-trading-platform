name: CI
on:
  pull_request:
  push:
    branches: [main, feat/postgres-persistence-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate project baseline
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f README.md
          test -f SECURITY.md
          test -f docs/engineering/PROJECT_CONTINUITY.md
          git diff --check
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            **/*.md
            !**/node_modules/**
  macos:
    name: macOS build, tests, and Swift CodeQL (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Intel x86_64
            runner: macos-15-intel
            codeql: true
          - architecture: Apple Silicon arm64
            runner: macos-15
            codeql: false
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Inspect Apple toolchain and verify runner architecture
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          swift --version
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.architecture == 'Intel x86_64' && 'x86_64' || 'arm64' }}"
          echo "Runner architecture: $actual_arch (expected $expected_arch)"
          test "$actual_arch" = "$expected_arch"
      - name: Install XcodeGen
        run: bash scripts/install-xcodegen.sh
      - name: Generate Xcode project
        working-directory: apps/macos/ATHEERTradingPro
        run: $HOME/.local/bin/xcodegen generate
      - uses: github/codeql-action/init@v4
        if: matrix.codeql
        with:
          languages: swift
      - name: Inspect generated schemes
        run: xcodebuild -list -project apps/macos/ATHEERTradingPro/ATHEERTradingPro.xcodeproj
      - name: Build Debug application
        run: |
          xcodebuild -project apps/macos/ATHEERTradingPro/ATHEERTradingPro.xcodeproj -scheme ATHEERTradingPro -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests
        run: |
          xcodebuild -project apps/macos/ATHEERTradingPro/ATHEERTradingPro.xcodeproj -scheme ATHEERTradingPro -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Build Release application
        run: |
          xcodebuild -project apps/macos/ATHEERTradingPro/ATHEERTradingPro.xcodeproj -scheme ATHEERTradingPro -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@v4
        if: matrix.codeql
  backend-toolchain:
    name: Backend toolchain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atheer_test
          POSTGRES_PASSWORD: atheer_test_password
          POSTGRES_DB: atheer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atheer_test -d atheer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://atheer_test:atheer_test_password@localhost:5432/atheer_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"
      - name: Install API dependencies
        working-directory: services/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type-check API
        working-directory: services/api
        run: npm run typecheck
      - name: Test API
        working-directory: services/api
        run: npm test
