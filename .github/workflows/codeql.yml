name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
          - language: actions
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Swift project for CodeQL
        if: matrix.language == 'swift'
        run: bash scripts/install-xcodegen.sh
      - name: Generate Xcode project
        if: matrix.language == 'swift'
        working-directory: apps/macos/ATHEERTradingPro
        run: $HOME/.local/bin/xcodegen generate
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Build Swift application for analysis
        if: matrix.language == 'swift'
        run: |
          xcodebuild -project apps/macos/ATHEERTradingPro/ATHEERTradingPro.xcodeproj -scheme ATHEERTradingPro -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@v4
