  <rect width="720" height="236" fill="#001F3F"/>
  <g transform="translate(12 12)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-market-search" href="#atheer-market-search" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Market Search</text></g>
  <g transform="translate(154 12)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-candlestick-chart" href="#atheer-candlestick-chart" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Candlestick Chart</text></g>
  <g transform="translate(296 12)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-risk-shield" href="#atheer-risk-shield" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Risk Shield</text></g>
  <g transform="translate(438 12)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-strategy-flow" href="#atheer-strategy-flow" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Strategy Flow</text></g>
  <g transform="translate(580 12)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-portfolio-grid" href="#atheer-portfolio-grid" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Portfolio Grid</text></g>
  <g transform="translate(12 122)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-order-flow" href="#atheer-order-flow" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Order Flow</text></g>
  <g transform="translate(154 122)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-activity-pulse" href="#atheer-activity-pulse" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Activity Pulse</text></g>
  <g transform="translate(296 122)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-intelligence-spark" href="#atheer-intelligence-spark" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Intelligence Spark</text></g>
  <g transform="translate(438 122)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-workspace-layout" href="#atheer-workspace-layout" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">Workspace Layout</text></g>
  <g transform="translate(580 122)"><rect class="tile" width="130" height="96" rx="10"/><use xlink:href="#atheer-system-settings" href="#atheer-system-settings" x="49" y="12" width="32" height="32" class="glyph"/><text class="label" x="65" y="75" text-anchor="middle">System Settings</text></g>
