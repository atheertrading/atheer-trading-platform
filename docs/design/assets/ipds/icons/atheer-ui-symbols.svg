    <path d="M19 2v4M17 4h4M4 17v4M2 19h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="atheer-workspace-layout" viewBox="0 0 24 24">
