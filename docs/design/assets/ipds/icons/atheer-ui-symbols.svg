<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="236" viewBox="0 0 720 236" role="img" aria-labelledby="title desc">
  <title id="title">ATHEER geometric interface symbol atlas</title>
  <desc id="desc">Ten reusable geometric SVG symbols on a dark navy presentation sheet. Native macOS interfaces should use SF Symbols when a suitable system symbol exists.</desc>
  <defs>
    <style>
      .tile { fill: #0B1B2B; stroke: #24445E; stroke-width: 1; }
      .label { fill: #DCE8EF; font: 11px -apple-system, BlinkMacSystemFont, sans-serif; }
      .glyph { color: #40DCD2; }
    </style>
  <symbol id="atheer-market-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="m15.5 15.5 5 5M7.5 12l2-2 1.8 1.5 3.2-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="atheer-candlestick-chart" viewBox="0 0 24 24">
    <path d="M5 3v18M12 2v20M19 4v16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="3.2" y="8" width="3.6" height="6" rx="0.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="10.2" y="6" width="3.6" height="10" rx="0.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="17.2" y="9" width="3.6" height="5" rx="0.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
  <symbol id="atheer-risk-shield" viewBox="0 0 24 24">
    <path d="M12 2.5 20 5.5v5.8c0 5-3.3 8.5-8 10.2-4.7-1.7-8-5.2-8-10.2V5.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="m8.3 12.1 2.4 2.4 5-5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="atheer-strategy-flow" viewBox="0 0 24 24">
    <rect x="2.8" y="3" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="15.2" y="16" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="18.2" cy="5.5" r="2.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8.8 5.5h3.8a2.5 2.5 0 0 1 2.5 2.5v5.5a2.5 2.5 0 0 0 2.5 2.5M12 8.5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="atheer-portfolio-grid" viewBox="0 0 24 24">
    <rect x="3" y="3" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="13" y="3" width="8" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="13" y="10" width="8" height="11" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <rect x="3" y="13" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  </symbol>
  <symbol id="atheer-order-flow" viewBox="0 0 24 24">
