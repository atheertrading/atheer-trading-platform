<rect x="852" y="112" width="160" height="54" rx="8" class="sub"/><text x="868" y="135" class="xs">AVAILABLE MARGIN</text><text x="868" y="155" class="t">Broker value</text>
<rect x="1024" y="112" width="160" height="54" rx="8" class="sub"/><text x="1040" y="135" class="xs">OPEN EXPOSURE</text><text x="1040" y="155" class="t">Calculated</text>
