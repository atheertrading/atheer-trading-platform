<text x="1072" y="234" class="t">Context inspector</text><text x="1072" y="258" class="s">Selection details · parameters · evidence</text>
<rect x="1070" y="280" width="316" height="92" rx="8" class="sub"/><text x="1088" y="308" class="xs">SELECTED INSTRUMENT / OBJECT</text><text x="1088" y="339" class="t">Contextual details</text>
<rect x="1070" y="386" width="316" height="100" rx="8" class="sub"/><text x="1088" y="414" class="xs">SOURCE &amp; FRESHNESS</text><text x="1088" y="443" class="s">Provider · timestamp · data state</text><text x="1088" y="465" class="s">Live / delayed / stale / unavailable</text>
<rect x="1070" y="500" width="316" height="104" rx="8" class="sub"/><text x="1088" y="528" class="xs">GOVERNED ACTIONS</text><text x="1088" y="556" class="s">Intent → Identity → Domain → Risk</text><text x="1088" y="578" class="s">→ OMS → Gateway → Reconciliation</text>
<rect x="270" y="644" width="1138" height="184" rx="12" class="panel"/>
<text x="294" y="678" class="t">Supporting workspace panels</text>
<g>
<rect x="292" y="696" width="344" height="108" rx="8" class="sub"/><text x="312" y="725" class="s">POSITIONS / ORDERS</text><text x="312" y="755" class="xs">Broker-confirmed lifecycle and quantities</text>
<rect x="650" y="696" width="344" height="108" rx="8" class="sub"/><text x="670" y="725" class="s">ALERTS / DECISION JOURNAL</text><text x="670" y="755" class="xs">Reason, provenance, acknowledgement</text>
<rect x="1008" y="696" width="378" height="108" rx="8" class="sub"/><text x="1028" y="725" class="s">SERVICE HEALTH</text><text x="1028" y="755" class="xs">Broker · Market Data · Risk · OMS · Gateway</text>
</g>
<rect x="32" y="842" width="1376" height="26" rx="8" fill="#12353b"/>
<circle cx="52" cy="855" r="5" fill="#00c853"/><text x="66" y="860" class="xs">Persistent operational status — environment, connectivity, quote freshness, risk state, critical alerts</text>
<text x="1378" y="860" text-anchor="end" class="xs">STRUCTURAL CONCEPT · NOT IMPLEMENTED UI</text>
</svg>